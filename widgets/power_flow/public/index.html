<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="flow.css">
  <script src="icons.js"></script>
  <script src="flow.js"></script>
</head>
<body>
  <svg id="flow" viewBox="0 0 320 262" role="img"></svg>
  <div id="empty"></div>
  <script>
    var started = false;

    function onHomeyReady(Homey) {
      if (started) return;
      started = true;
      var lang = (typeof Homey.getLanguage === 'function' && Homey.getLanguage()) || navigator.language || 'en';
      if (lang === 'ar') document.documentElement.dir = 'rtl';
      var kw = new Intl.NumberFormat(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      var svg = document.getElementById('flow');
      var empty = document.getElementById('empty');
      var nodes = PbthFlow.build(svg);
      var ready = false;

      function power(w) {
        var a = Math.abs(w);
        return a < 1000 ? Math.round(a) + ' W' : kw.format(a / 1000) + ' kW';
      }

      // into: power flows from the node into the hub.
      function show(id, w, into, soc) {
        if (typeof w !== 'number') {
          PbthFlow.set(nodes[id], null);
          return;
        }
        var on = Math.abs(w) >= 10;
        PbthFlow.set(nodes[id], {
          values: [power(w)],
          label: Homey.__('widget.' + id) + (typeof soc === 'number' ? ' ' + soc + '%' : ''),
          // Faster dots at higher power: ~2.2 s at 100 W, ~0.5 s at 10 kW.
          flow: on ? { into: into, dur: Math.max(0.5, Math.min(3.5, 4 - 0.9 * Math.log10(Math.abs(w)))) } : null,
        });
      }

      function render(d) {
        var noGrid = !d || typeof d.grid !== 'number';
        svg.style.display = noGrid ? 'none' : '';
        empty.style.display = noGrid ? 'block' : 'none';
        if (noGrid) {
          empty.textContent = Homey.__('widget.no_grid');
          return;
        }
        show('gas', null);
        show('solar', d.solar, true);
        show('grid', d.grid, d.grid > 0);
        show('home', d.home, false);
        show('battery', d.battery, d.battery < 0, d.batterySoc);
        show('ev', d.ev, false, d.evSoc);
      }

      function refresh() {
        if (document.hidden && ready) return;
        Homey.api('GET', '/', {})
          .then(render)
          .catch(function (err) { console.error(err); })
          .finally(function () {
            if (!ready) {
              ready = true;
              Homey.ready();
            }
          });
      }

      refresh();
      setInterval(refresh, 5000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
    }

    if (typeof window.Homey !== 'undefined') onHomeyReady(window.Homey);
  </script>
</body>
</html>
