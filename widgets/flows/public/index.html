<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="colors.css">
  <style>
    .tabs { display: flex; gap: 2px; margin: 0 8px 4px; padding: 2px; border-radius: 9px; background: var(--line); }
    .tabs button {
      flex: 1; border: 0; border-radius: 7px; padding: 5px 0; background: transparent;
      color: var(--muted); font: inherit; font-size: 12px; cursor: pointer;
    }
    .tabs button.on { background: var(--node-bg); color: var(--text); font-weight: 600; }
    svg { display: block; width: 100%; height: auto; }
    .name { fill: var(--text); font-weight: 400; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.8)); }
    .val { fill: var(--muted); font-weight: 400; }
    .dots { fill: none; stroke: var(--text); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 0 12; opacity: 0.45; animation: run linear infinite; }
    @keyframes run { to { stroke-dashoffset: -36; } }
  </style>
  <script src="periodcache.js"></script>
</head>
<body>
  <div class="tabs" id="tabs"></div>
  <div class="chartbox">
    <svg id="flows" viewBox="0 0 320 250" role="img"></svg>
    <div id="empty"></div>
  </div>
  <script>
    var started = false;
    var PERIODS = ['now', 'hour', 'day', 'month', 'year'];
    var W = 320;
    var H = 250; // chart height: 250 normal, 170 widescreen (setting shape)
    var TOP = 6;
    var BOTTOM = H - 6; // set per draw
    var XL = 4; // source bars
    var XM = 118; // destination bars: left of centre, room for the labels of destinations and users
    var XR = W - 4 - 6; // user bars
    var GAP_R = 3; // between users
    var BAR = 6;
    var GAP = 6;
    var FONT_PX = 10; // label size on screen, whatever the widget width
    var LABEL = 12; // minimum distance between label lines (chart units; set per draw from FONT_PX)
    var MAX_USERS = 16; // the largest are shown; users under 1% are not drawn
    var MAX_LABEL = 134; // chart units, so the labels of both halves never meet
    var NS = 'http://www.w3.org/2000/svg';
    var COLORS = {
      grid: '--c-grid', solar: '--c-solar', battery: '--c-battery', ev: '--c-ev', home: '--c-home', gas: '--c-gas', zone: '--c-zone', export: '--c-export',
      power: '--c-appliance', climate: '--c-climate', other: '--muted', more: '--muted',
    };

    function el(tag, attrs, parent, text) {
      var e = document.createElementNS(NS, tag);
      Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      if (text !== undefined) e.textContent = text;
      if (parent) parent.appendChild(e);
      return e;
    }

    // Label centres (top-down) at least LABEL apart within [lo, hi]: pushed down, then up from hi.
    function spread(ys, lo, hi) {
      var out = ys.slice();
      var i;
      for (i = 0; i < out.length; i += 1) out[i] = Math.max(out[i], i ? out[i - 1] + LABEL : lo);
      for (i = out.length - 1; i >= 0; i -= 1) out[i] = Math.min(out[i], i < out.length - 1 ? out[i + 1] - LABEL : hi);
      return out;
    }

    // A band from x0 (y0a..y0b) to x1 (y1a..y1b).
    function band(x0, y0a, y0b, x1, y1a, y1b) {
      var xm = (x0 + x1) / 2;
      return 'M' + x0 + ' ' + y0a + 'C' + xm + ' ' + y0a + ' ' + xm + ' ' + y1a + ' ' + x1 + ' ' + y1a
        + 'L' + x1 + ' ' + y1b + 'C' + xm + ' ' + y1b + ' ' + xm + ' ' + y0b + ' ' + x0 + ' ' + y0b + 'Z';
    }
    function mid(x0, y0, x1, y1) {
      var xm = (x0 + x1) / 2;
      return 'M' + x0 + ' ' + y0 + 'C' + xm + ' ' + y0 + ' ' + xm + ' ' + y1 + ' ' + x1 + ' ' + y1;
    }

    function onHomeyReady(Homey) {
      if (started) return;
      started = true;
      // The Homey's language (the texts are in it too), not the phone's: dates and numbers.
      var homeyLang = Homey.__('widget.lang');
      var lang = homeyLang && homeyLang.indexOf('.') < 0 ? homeyLang : (navigator.language || 'en');
      if (lang === 'ar') document.documentElement.dir = 'rtl';
      var fmt = [0, 1, 2].map(function (n) { return new Intl.NumberFormat(lang, { minimumFractionDigits: n, maximumFractionDigits: n }); });
      var svg = document.getElementById('flows');
      var empty = document.getElementById('empty');
      var tabs = document.getElementById('tabs');
      var key = 'pbth-flows-' + (typeof Homey.getWidgetInstanceId === 'function' ? Homey.getWidgetInstanceId() : '');
      var period = ((typeof Homey.getSettings === 'function' && Homey.getSettings()) || {}).start || 'last';
      if (period === 'last') {
        period = 'day';
        try { period = localStorage.getItem(key) || 'day'; } catch (e) { /* no storage: default */ }
      }
      if (PERIODS.indexOf(period) < 0) period = 'day';
      var ready = false;
      var store = window.PbthPeriodCache();
      var t = function (k) { return Homey.__('widget.' + k); };
      var cap = function (s) { return s.charAt(0).toUpperCase() + s.slice(1); };

      PERIODS.forEach(function (p) {
        var b = document.createElement('button');
        b.textContent = t(p);
        b.dataset.id = p;
        b.addEventListener('click', function () {
          if (typeof Homey.hapticFeedback === 'function') Homey.hapticFeedback();
          period = p;
          try { localStorage.setItem(key, p); } catch (e) { /* not kept */ }
          markTabs();
          if (store.fresh(period)) {
            render(store.get(period));
            fit();
          } else refresh(true);
        });
        tabs.appendChild(b);
      });
      function markTabs() {
        Array.prototype.forEach.call(tabs.children, function (b) { b.classList.toggle('on', b.dataset.id === period); });
      }
      markTabs();

      function value(v, live) {
        var a = Math.abs(v || 0);
        if (live) return a < 1000 ? Math.round(a) + ' W' : fmt[1].format(a / 1000) + ' kW';
        return fmt[a < 10 ? 2 : a < 1000 ? 1 : 0].format(a) + ' kWh';
      }
      // PbtH device names end in _Σ<driver>: not shown.
      function shortName(name) {
        var n = String(name).replace(/_Σ\w*/, '').trim();
        return n.length > 18 ? n.slice(0, 17) + '…' : n;
      }

      // Splits parent into children (each { name, kind, value }); none when it has fewer than two.
      function kids(list) { return list.length >= 2 ? list : []; }

      function draw(d) {
        while (svg.firstChild) svg.removeChild(svg.firstChild);
        H = settings.shape !== 'normal' ? 170 : 250;
        BOTTOM = H - 6;
        svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
        // Chart units per screen pixel: the text stays FONT_PX on screen.
        var unit = W / (svg.getBoundingClientRect().width || W);
        var fontSize = FONT_PX * unit;
        LABEL = fontSize * 1.3;
        var live = d.live;
        var nm = function (n) {
          return {
            name: shortName(n.name), value: n.value, zone: n.zone || null, zoneOrder: n.zoneOrder,
          };
        };
        var on = function (x) { return x.value > 0; };
        // Gas: L/min × 60 / 1000 = m³/h, × kWh per m³ = kW; or m³ × kWh per m³.
        var perM3 = Number(settings.gas_kwh) || 9.77;
        var gas = settings.gas !== false && typeof d.gas === 'number' ? d.gas * (live ? 60 * perM3 : perM3) : 0;

        var srcs = d.sources.filter(on).map(function (x) { return { name: t(x.key), kind: x.key, value: x.value }; });
        if (gas > 0) srcs.push({ name: t('gas'), kind: 'gas', value: gas, gas: true });
        // Sources below 0.5% of the total are not drawn (such as solar at dusk).
        var srcTotal = srcs.reduce(function (a, x) { return a + x.value; }, 0);
        srcs = srcs.filter(function (x) { return x.gas || x.value >= srcTotal * 0.005; });
        // In the order the destinations are filled (export and battery charging from the sun first),
        // so the bands do not cross.
        var ORDER = ['solar', 'battery', 'ev', 'grid', 'gas'];
        srcs.sort(function (a, b) { return ORDER.indexOf(a.kind) - ORDER.indexOf(b.kind); });

        // Destinations as in the Energy widget; each with its single users when it has two or more.
        var evs = d.evs.map(nm).filter(on);
        var clim = d.climate.map(nm).filter(on);
        var climEl = clim.reduce(function (a, x) { return a + x.value; }, 0);
        // Users that do not fit within the home (a group, or a meter that is no user) are left out,
        // largest first; the rest still splits the home.
        var users = d.users.map(nm).filter(on);
        var tol = live ? 20 : 0.05;
        var sum = function (list) { return list.reduce(function (a, x) { return a + x.value; }, 0); };
        while (users.length && sum(users) > d.home * 1.05 + tol) {
          var worst = users.reduce(function (a, x) { return x.value > a.value ? x : a; });
          users = users.filter(function (x) { return x !== worst; });
        }
        var measured = sum(users);
        // Users drawn: from 0.5% of the total, and the largest of each zone; at most the MAX_USERS largest.
        // Smaller ones are not drawn (their share stays in their zone). The rest of the home as Not measured.
        var total0 = srcs.reduce(function (a, x) { return a + x.value; }, 0);
        var zoneMax = {};
        users.forEach(function (u) { zoneMax[u.zone] = Math.max(zoneMax[u.zone] || 0, u.value); });
        var top = users.filter(function (u) { return u.value >= total0 * 0.005 || (u.value > 0 && u.value === zoneMax[u.zone]); })
          .sort(function (a, b) { return b.value - a.value; }).slice(0, MAX_USERS);
        var big = users.filter(function (u) { return top.indexOf(u) >= 0; });
        var otherHome = d.home - measured;
        var homeKids = [];
        var homeNodes;
        if (big.length && settings.zones !== false) {
          // Zones: the home as its zones in Homey's order, each with its users by name (as in Homey); the
          // unmeasured rest apart.
          var zones = [];
          users.forEach(function (u) {
            var name = u.zone || t('home');
            var z = zones.filter(function (x) { return x.name === name; })[0];
            if (!z) {
              z = { name: name, kind: 'zone', value: 0, kids: [], order: typeof u.zoneOrder === 'number' ? u.zoneOrder : Infinity };
              zones.push(z);
            }
            z.value += u.value;
            if (big.indexOf(u) >= 0) z.kids.push({ name: u.name, kind: 'power', value: u.value });
          });
          zones.sort(function (a, b) { return (a.order - b.order) || a.name.localeCompare(b.name); });
          zones.forEach(function (z) { z.kids.sort(function (a, b) { return a.name.localeCompare(b.name); }); });
          zones.forEach(function (z) {
            // With Homey Energy: the zone as Homey measures it; its devices not shown keep their part
            // of the zone bar without a band.
            var homeyZone = d.zoneTotals && d.zoneTotals[z.name];
            if (typeof homeyZone === 'number' && homeyZone > z.value) z.value = homeyZone;
          });
          var inZones = zones.reduce(function (a, z) { return a + z.value; }, 0);
          if (d.home - inZones > 0) zones.push({ name: t('unmeasured'), kind: 'other', value: d.home - inZones, kids: [] });
          homeNodes = zones;
        } else {
          if (big.length) {
            homeKids = big.map(function (u) { return { name: u.name, kind: 'power', value: u.value }; });
          }
          homeNodes = [{ name: t(clim.length || gas ? 'home_other' : 'home'), kind: 'home', value: d.home, kids: homeKids }];
        }
        var middle = [
          { name: cap(t('export')), kind: 'export', value: d.exported, el: d.exported },
          { name: t('battery_charge'), kind: 'battery', value: d.batteryCharge || 0, el: d.batteryCharge || 0 },
          {
            name: evs.length === 1 ? evs[0].name : t('ev'), kind: 'ev', value: evs.reduce(function (a, x) { return a + x.value; }, 0),
            kids: kids(evs.map(function (x) { return { name: x.name, kind: 'ev', value: x.value }; })),
          },
        ].concat(homeNodes, [
          {
            name: t('climate'), kind: 'climate', value: climEl + gas, gasIn: gas,
            kids: kids(clim.map(function (x) { return { name: x.name, kind: 'climate', value: x.value }; })
              .concat(gas > 0 ? [{ name: t('gas'), kind: 'gas', value: gas }] : [])),
          },
        ]).filter(on);
        middle.forEach(function (m) { if (m.el === undefined) m.el = m.value - (m.gasIn || 0); m.kids = m.kids || []; });

        // Inflow per destination: electricity in proportion, gas to climate only; drawn heights follow
        // the inflow, so the bands meet exactly (meters drift a little apart).
        var elSrc = srcs.filter(function (x) { return !x.gas; }).reduce(function (a, x) { return a + x.value; }, 0);
        var elDst = middle.reduce(function (a, m) { return a + m.el; }, 0);
        middle.forEach(function (m) { m.flow = (elDst > 0 ? elSrc * m.el / elDst : 0) + (m.gasIn || 0); });
        var right = [];
        middle.forEach(function (m) {
          var sum = m.kids.reduce(function (a, x) { return a + x.value; }, 0);
          // Shares of the destination itself: users not drawn leave their part without a band.
          m.kids.forEach(function (c) { c.parent = m; c.flow = sum > 0 ? m.flow * c.value / Math.max(sum, m.value) : 0; right.push(c); });
        });

        // Without users the destinations stand at the right edge: two columns over the full width.
        var xm = right.length ? XM : XR;
        var span = BOTTOM - TOP;
        var total = srcs.reduce(function (a, x) { return a + x.value; }, 0);
        // Every node gets a slot of at least LABEL for its text, so small flows sit apart and a large
        // one does not fill the whole height. fitK: the largest scale at which a column fits.
        var fitK = function (values, gap) {
          var room = span - gap * Math.max(0, values.length - 1);
          var kk = total > 0 ? room / total : 0;
          for (var it = 0; it < 12 && kk > 0; it += 1) {
            var fixed = 0;
            var varSum = 0;
            values.forEach(function (v) { if (v * kk < LABEL) fixed += LABEL; else varSum += v; });
            kk = varSum > 0 ? Math.max(0, room - fixed) / varSum : kk;
          }
          return kk;
        };
        var vals = function (nodes, key) { return nodes.map(function (n) { return n[key]; }); };
        // Funnel: the sources compact (at most half the height), the destinations spread over 80%, the
        // users over the full height.
        var k = Math.min(fitK(vals(srcs, 'value'), 2), fitK(vals(middle, 'flow'), GAP), fitK(vals(right, 'flow'), GAP_R),
          total > 0 ? (0.5 * span) / total : 0);
        var slot = function (n, key) { return Math.max(LABEL, n[key] * k); };
        var column = function (nodes, key, target, minGap) {
          var size = nodes.reduce(function (a, n) { return a + slot(n, key); }, 0);
          var gaps = Math.max(0, nodes.length - 1);
          var gap = gaps ? Math.max(minGap, (target - size) / gaps) : 0;
          if (size + gap * gaps > span) gap = gaps ? Math.max(0, (span - size) / gaps) : 0;
          var y = TOP + Math.max(0, (span - size - gap * gaps) / 2);
          nodes.forEach(function (n) {
            var sl = slot(n, key);
            n.h = Math.max(2, n[key] * k);
            n.y0 = y + (sl - n.h) / 2;
            n.y1 = n.y0 + n.h;
            y += sl + gap;
          });
        };
        column(srcs, 'value', 0, 2);
        column(middle, 'flow', 0.8 * span, GAP);
        column(right, 'flow', span, GAP_R);

        var bands = el('g', {}, svg);
        // Dots stop at the labels: a mask with a hole per label.
        var mask = el('mask', { id: 'nolabels', maskUnits: 'userSpaceOnUse', x: 0, y: 0, width: W, height: H }, el('defs', {}, svg));
        el('rect', { x: 0, y: 0, width: W, height: H, fill: 'white' }, mask);
        var dots = el('g', { mask: 'url(#nolabels)' }, svg);
        var bars = el('g', {}, svg);
        var labels = el('g', { 'font-size': fontSize.toFixed(2) }, svg);
        // Calm dots: a little faster at more power (3 s per step at 10 kW, 6 s at 10 W).
        var dur = function (w) { return Math.max(3, Math.min(6, 7 - Math.log10(Math.max(1, w)))).toFixed(2) + 's'; };
        // A link is at least a thin line, so a small flow stays visible next to a large one.
        var link = function (x0, a, x1, b, w, color, v) {
          var dw = Math.max(1, w);
          el('path', { d: band(x0, a, a + dw, x1, b, b + dw), fill: color, opacity: w < 1.5 ? 0.7 : 0.4 }, bands);
          if (live && v > 0) el('path', { d: mid(x0, a + dw / 2, x1, b + dw / 2), class: 'dots', style: 'animation-duration:' + dur(v) }, dots);
        };
        var col = function (n) { return 'var(' + COLORS[n.kind] + ')'; };

        // Sources to destinations.
        var inAt = middle.map(function (m) { m.mix = []; return m.y0; });
        var need = middle.map(function (m) { return m.flow - (m.gasIn || 0); });
        var NEVER = { battery: 'battery', ev: 'ev', grid: 'export' };
        srcs.forEach(function (x) {
          x.out = x.y0;
          x.left = x.value;
          if (!x.gas) return;
          middle.forEach(function (m, j) {
            if (!m.gasIn) return;
            link(XL + BAR, x.out, xm, inAt[j], m.gasIn * k, col(x), m.gasIn);
            m.mix.push({ color: col(x), v: m.gasIn, gas: true });
            x.out += m.gasIn * k;
            inAt[j] += m.gasIn * k;
          });
          x.left = 0;
        });
        var pairs = !live && d.pairs;
        var dstOf = function (m) { return m.kind === 'export' || m.kind === 'battery' || m.kind === 'ev' ? m.kind : 'home'; };
        var share = function (x, m) {
          var dst = dstOf(m);
          var all = Object.keys(pairs).reduce(function (a, s) { return a + ((pairs[s] && pairs[s][dst]) || 0); }, 0);
          return all > 0 && pairs[x.kind] ? (pairs[x.kind][dst] || 0) / all : 0;
        };
        var want = need.slice();
        (pairs ? ['pairs', 'never', 'any'] : ['never', 'any']).forEach(function (pass) {
          srcs.forEach(function (x) {
            middle.forEach(function (m, j) {
              if (x.left <= 1e-9 || (pass !== 'any' && NEVER[x.kind] === m.kind)) return;
              var v = Math.min(x.left, need[j], pass === 'pairs' ? want[j] * share(x, m) : Infinity);
              if (v <= 1e-9) return;
              link(XL + BAR, x.out, xm, inAt[j], v * k, col(x), v);
              m.mix.push({ color: col(x), v: v });
              x.out += v * k;
              inAt[j] += v * k;
              need[j] -= v;
              x.left -= v;
            });
          });
        });
        // Destinations to their users, in the colours of the sources that feed the destination.
        middle.forEach(function (m) {
          var from = m.y0;
          m.kids.forEach(function (c) {
            // Gas only to the gas user, electricity only to the others.
            var mix = m.mix.filter(function (x) { return !!x.gas === (c.kind === 'gas'); });
            var mixSum = mix.reduce(function (a, x) { return a + x.v; }, 0);
            var w = c.flow * k;
            var at = c.y0;
            (mixSum > 0 ? mix : [{ color: col(c), v: 1 }]).forEach(function (x) {
              var part = w * (x.v / (mixSum || 1));
              if (part <= 0) return;
              link(xm + BAR, from, XR, at, part, x.color, c.flow * (x.v / (mixSum || 1)));
              from += part;
              at += part;
            });
          });
        });

        [[srcs, XL], [middle, xm], [right, XR]].forEach(function (c) {
          c[0].forEach(function (n) { el('rect', { x: c[1], y: n.y0, width: BAR, height: n.h, rx: 2, fill: col(n) }, bars); });
        });

        // Labels per column, each spaced at least LABEL apart (the slots already give that, so they stay
        // centred on their node). Sources right of their bar; destinations right of theirs (without
        // users: left of it, at the right edge); users left of theirs. A name that does not fit is
        // shortened, the value always stays; a user label beside a destination label is shortened to
        // end before it, it does not move.
        var label = function (l, y, maxW) {
          var text = el('text', {
            x: l.x, y: y, 'text-anchor': l.anchor, 'dominant-baseline': 'central', class: 'name',
          }, labels);
          var name = l.n.name;
          var nameEl = document.createTextNode(name + ' ');
          text.appendChild(nameEl);
          el('tspan', { class: 'val' }, text, value(l.n.value, live));
          while (name.length > 3 && text.getComputedTextLength() > maxW) {
            name = name.slice(0, -1);
            nameEl.nodeValue = name.trim() + '… ';
          }
          return text;
        };
        var place = function (list, maxW) {
          list.forEach(function (l) { l.y = (l.n.y0 + l.n.y1) / 2; });
          return spread(list.map(function (l) { return l.y; }), TOP + 5, BOTTOM - 5).map(function (y, i) {
            var text = label(list[i], y, typeof maxW === 'function' ? maxW(y) : maxW);
            return { y: y, box: text.getBBox() };
          });
        };
        var holes = function () {
          Array.prototype.forEach.call(labels.childNodes, function (text) {
            var b = text.getBBox();
            el('rect', { x: b.x - 3, y: b.y - 1, width: b.width + 6, height: b.height + 2, rx: 3, fill: 'black' }, mask);
          });
        };
        place(srcs.map(function (n) { return { n: n, x: XL + BAR + 4, anchor: 'start' }; }), MAX_LABEL);
        var mids = place(middle.map(function (n) {
          return right.length ? { n: n, x: xm + BAR + 4, anchor: 'start' } : { n: n, x: xm - 4, anchor: 'end' };
        }), MAX_LABEL);
        place(right.map(function (n) { return { n: n, x: XR - 4, anchor: 'end' }; }), function (y) {
          var end = XR - 4;
          mids.forEach(function (m) { if (Math.abs(m.y - y) < LABEL) end = Math.min(end, XR - 4 - (m.box.x + m.box.width + 6)); });
          return Math.max(30, Math.min(MAX_LABEL, end));
        });
        holes();
      }

      // Height (px) down to the lowest visible element; the first call ends the loading state.
      var lastHeight = 0;
      function fit() {
        var bottom = 0;
        Array.prototype.forEach.call(document.body.children, function (e) {
          var r = e.getBoundingClientRect();
          if (r.height) bottom = Math.max(bottom, r.bottom + window.scrollY);
        });
        var h = Math.ceil(bottom) + 2;
        if (!ready) {
          ready = true;
          lastHeight = h;
          Homey.ready({ height: h });
          return;
        }
        if (h === lastHeight || typeof Homey.setHeight !== 'function') return;
        lastHeight = h;
        Homey.setHeight(h).catch(function () {});
      }

      var settings = (typeof Homey.getSettings === 'function' && Homey.getSettings()) || {};
      // Settings change what is asked (zones, Homey Energy): the kept data is dropped.
      if (typeof Homey.onSettings === 'function') {
        Homey.onSettings(function (x) {
          settings = x || settings;
          store.clear();
          refresh(true);
        });
      }
      function render(d) {
        var noGrid = !d || !d.grid;
        svg.classList.toggle('hide', noGrid);
        empty.style.display = noGrid ? 'flex' : 'none';
        if (noGrid) {
          svg.setAttribute('viewBox', '0 0 ' + W + ' ' + (settings.shape !== 'normal' ? 170 : 250));
          empty.textContent = t('no_grid');
          return;
        }
        draw(d);
      }

      // Live power every 5 s; a period only when it can have changed (periodcache.js).
      function refresh(force) {
        if ((document.hidden && ready) || store.pending[period]) return;
        if (!force && store.fresh(period)) return;
        var asked = period;
        store.pending[asked] = true;
        var ids = typeof Homey.getDeviceIds === 'function' ? Homey.getDeviceIds() || [] : [];
        var zonesOn = settings.zones !== false ? '1' : '0';
        var homeyOn = settings.zones !== false && settings.zones_homey === true ? '1' : '0';
        Homey.api('GET', '/?period=' + asked + '&zones=' + zonesOn + '&homey=' + homeyOn + '&ids=' + encodeURIComponent(ids.join(',')), {})
          .then(function (d) {
            store.put(asked, d);
            if (asked === period) render(d); // not after a tab change
          })
          .catch(function (err) { console.error(err); })
          .finally(function () {
            store.pending[asked] = false;
            fit();
          });
      }

      refresh(true);
      setInterval(refresh, 5000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
    }

    if (typeof window.Homey !== 'undefined') onHomeyReady(window.Homey);
  </script>
</body>
</html>
