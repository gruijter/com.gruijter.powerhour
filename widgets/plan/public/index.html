<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="colors.css">
  <style>
    svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
    .time { fill: var(--text); font-size: 12px; font-weight: 600; }
    .hint { fill: var(--muted); font-size: 11px; }
    .value { fill: var(--text); font-size: 12px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 10px; }
    .tick { fill: var(--muted); font-size: 9px; }
    .tick.day { fill: var(--text); font-weight: 600; }
    .base { stroke: var(--line); stroke-width: 1; }
    .cursor { stroke: var(--text); stroke-width: 1; opacity: 0.5; }
  </style>
  <script src="icons.js"></script>
</head>
<body>
  <div class="chartbox">
    <svg id="plan" viewBox="0 0 320 280"></svg>
    <div id="empty"></div>
  </div>
  <script>
    var W = 320; // 480 for the widescreen shape (setting shape)
    var X0 = 78; // chart area; icon and values to its left
    var X1 = 316; // W - 4
    var TOP = 22; // selected time
    var LANE = 40; // 34 for widescreen
    var AXIS = 16;
    var PALE = 0.45; // discharging, export and expected prices
    var NS = 'http://www.w3.org/2000/svg';
    var started = false;

    function el(tag, attrs, parent, text) {
      var e = document.createElementNS(NS, tag);
      Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      if (text !== undefined) e.textContent = text;
      if (parent) parent.appendChild(e);
      return e;
    }

    function onHomeyReady(Homey) {
      if (started) return;
      started = true;
      var lang = (typeof Homey.getLanguage === 'function' && Homey.getLanguage()) || navigator.language || 'en';
      if (lang === 'ar') document.documentElement.dir = 'rtl';
      var kw = new Intl.NumberFormat(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      var money = new Intl.NumberFormat(lang, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      var t = function (k) { return Homey.__('widget.' + k); };
      var svg = document.getElementById('plan');
      var empty = document.getElementById('empty');
      var data = null;
      var selectedMs = null; // null: now
      var lastHeight = 0;
      var ready = false;

      function power(w, signed) {
        if (typeof w !== 'number' || Math.abs(w) < 1) return signed ? '0 W' : '-';
        var a = Math.abs(w);
        var s = a < 1000 ? Math.round(a) + ' W' : kw.format(a / 1000) + ' kW';
        return signed ? (w > 0 ? '+' : '−') + s : s;
      }
      function pct(v) { return typeof v === 'number' ? v + '%' : '-'; }

      function lanes(d) {
        var list = [];
        if (d.price) {
          list.push({
            icon: 'price', color: '--c-price', kind: 'price', values: d.price, forecast: d.priceForecast || [], levels: d.priceLevel || [],
            value: function (i) { return typeof d.price[i] === 'number' ? money.format(d.price[i]) : '-'; },
            sub: function () { return d.currency || ''; },
          });
        }
        if (d.solar) list.push({ icon: 'solar', color: '--c-solar', kind: 'area', values: d.solar, value: function (i) { return power(d.solar[i]); } });
        if (d.battery) {
          list.push({
            icon: 'battery', color: '--c-battery', kind: 'soc', values: d.battery, soc: d.soc,
            value: function (i) { return d.soc ? pct(d.soc[i]) : power(d.battery[i], true); },
            sub: function (i) { return d.soc ? power(d.battery[i], true) : ''; },
          });
        }
        if (d.ev) {
          list.push({
            icon: 'ev', color: '--c-ev', kind: 'soc', values: d.ev, soc: d.evSoc,
            value: function (i) { return d.evSoc ? pct(d.evSoc[i]) : power(d.ev[i]); },
            sub: function (i) { return d.evSoc ? power(d.ev[i]) : ''; },
          });
        }
        var apps = d.appliances || [];
        if (apps.length) {
          list.push({
            icon: 'appliance', color: '--c-appliance', kind: 'apps', apps: apps,
            value: function (i) {
              return power(apps.reduce(function (sum, a) { return sum + (a.w[i] || 0); }, 0));
            },
            // Running now: its name (+ the number of others); else the next start.
            sub: function (i) {
              var on = apps.filter(function (a) { return a.w[i] > 0; });
              if (on.length) return on[0].name + (on.length > 1 ? ' +' + (on.length - 1) : '');
              var next = null;
              apps.forEach(function (a) {
                for (var k = i + 1; k < a.w.length; k += 1) {
                  if (a.w[k] > 0) {
                    if (!next || k < next.k) next = { k: k, name: a.name };
                    return;
                  }
                }
              });
              return next ? timeFmt.format(d.startMs + next.k * d.slotMs) + ' ' + next.name : '';
            },
          });
        }
        list.push({
          icon: 'grid', color: '--c-grid', kind: 'signed', values: d.net,
          value: function (i) { return power(d.net[i]); },
          sub: function (i) {
            if (typeof d.net[i] !== 'number' || Math.abs(d.net[i]) < 1) return '';
            return t(d.net[i] > 0 ? 'import' : 'export');
          },
        });
        return list;
      }

      // Step-area path of values (>= 0) scaled to h, rising from baseline y.
      function stepPath(vals, sw, y, h, peak) {
        var p = 'M' + X0 + ' ' + y;
        vals.forEach(function (v, i) {
          var yy = (y - (Math.max(0, v) / peak) * h).toFixed(2);
          p += 'L' + (X0 + i * sw).toFixed(2) + ' ' + yy + 'L' + (X0 + (i + 1) * sw).toFixed(2) + ' ' + yy;
        });
        return p + 'L' + X1 + ' ' + y + 'Z';
      }

      // Runs of slots where test(v) holds, as [start, end) index pairs.
      function runs(vals, test) {
        var out = [];
        var s = -1;
        vals.forEach(function (v, i) {
          if (test(v) && s < 0) s = i;
          if (!test(v) && s >= 0) { out.push([s, i]); s = -1; }
        });
        if (s >= 0) out.push([s, vals.length]);
        return out;
      }

      function band(g, vals, test, color, opacity, y, h, sw) {
        runs(vals, test).forEach(function (r) {
          el('rect', {
            x: X0 + r[0] * sw, y: y, width: (r[1] - r[0]) * sw, height: h, rx: Math.min(2, h / 2), fill: color, opacity: opacity,
          }, g);
        });
      }

      function drawLane(g, lane, top, bottom, sw) {
        var color = 'var(' + lane.color + ')';
        if (lane.kind === 'apps') {
          // One thin row per appliance; darker at more power.
          var rowH = (bottom - top - 4) / lane.apps.length;
          lane.apps.forEach(function (a, ai) {
            var peak = Math.max.apply(null, a.w) || 1;
            runs(a.w, function (x) { return x > 0; }).forEach(function (r) {
              var avg = a.w.slice(r[0], r[1]).reduce(function (x, y) { return x + y; }, 0) / (r[1] - r[0]);
              el('rect', {
                x: X0 + r[0] * sw, y: top + 2 + ai * rowH + 1, width: (r[1] - r[0]) * sw, height: Math.max(2, rowH - 2), rx: Math.min(4, rowH / 2),
                fill: color, opacity: 0.35 + 0.65 * (avg / peak),
              }, g);
            });
          });
          return;
        }
        var vals = lane.values.map(function (v) { return typeof v === 'number' ? v : 0; });
        if (lane.kind === 'price') {
          // One step area per price level and known/expected: no seams between slots.
          var ps = lane.values.filter(function (v) { return typeof v === 'number'; });
          var base = Math.min(0, Math.min.apply(null, ps));
          var range = Math.max.apply(null, ps) - base || 1;
          ['free', 'cheap', 'normal', 'dear'].forEach(function (lv) {
            [false, true].forEach(function (expected) {
              var part = lane.values.map(function (v, i) {
                return typeof v === 'number' && (lane.levels[i] || 'normal') === lv && !!lane.forecast[i] === expected ? v - base : 0;
              });
              if (part.some(function (v) { return v > 0; })) {
                el('path', {
                  d: stepPath(part, sw, bottom, bottom - top, range), fill: 'var(--c-' + lv + ')', opacity: expected ? PALE : 1,
                }, g);
              }
            });
          });
          return;
        }
        if (lane.kind === 'area') {
          el('path', { d: stepPath(vals, sw, bottom, bottom - top, Math.max.apply(null, vals) || 1), fill: color, opacity: 0.85 }, g);
          return;
        }
        if (lane.kind === 'signed') {
          // Import up, export down (pale).
          var mid = (top + bottom) / 2;
          var pk = Math.max.apply(null, vals.map(Math.abs)) || 1;
          el('line', { x1: X0, x2: X1, y1: mid, y2: mid, class: 'base' }, g);
          el('path', { d: stepPath(vals, sw, mid, mid - top, pk), fill: color }, g);
          el('path', {
            d: stepPath(vals.map(function (x) { return -x; }), sw, mid, mid - top, pk),
            fill: color, opacity: PALE, transform: 'translate(0 ' + (2 * mid) + ') scale(1 -1)',
          }, g);
          return;
        }
        // soc: the planned SoC as a line over a light area; charging as a band below, discharging pale.
        var bandH = 5;
        var socBottom = bottom - bandH - 2;
        if (lane.soc) {
          var pts = [];
          lane.soc.forEach(function (s, k) {
            if (typeof s === 'number') pts.push([X0 + (k + 0.5) * sw, socBottom - (s / 100) * (socBottom - top)]);
          });
          if (pts.length > 1) {
            var line = pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
            el('polygon', {
              points: pts[0][0].toFixed(1) + ',' + socBottom + ' ' + line + ' ' + pts[pts.length - 1][0].toFixed(1) + ',' + socBottom,
              fill: color, opacity: 0.15,
            }, g);
            el('polyline', { points: line, fill: 'none', stroke: color, 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, g);
          }
        } else {
          el('path', { d: stepPath(vals, sw, socBottom, socBottom - top, Math.max.apply(null, vals) || 1), fill: color, opacity: 0.85 }, g);
        }
        band(g, vals, function (x) { return x > 0; }, color, 1, bottom - bandH, bandH, sw);
        band(g, vals, function (x) { return x < 0; }, color, PALE, bottom - bandH, bandH, sw);
      }

      var settings = (typeof Homey.getSettings === 'function' && Homey.getSettings()) || {};
      if (typeof Homey.onSettings === 'function') Homey.onSettings(function (x) { settings = x || settings; draw(); });
      var timeFmt = null;
      var dayFmt = null;
      var chart = null; // the drawn chart: lanes, slot width, selection layer

      function draw() {
        var d = data;
        W = settings.shape !== 'normal' ? 480 : 320;
        X1 = W - 4;
        LANE = settings.shape !== 'normal' ? 34 : 40;
        var noGrid = !d || !d.grid;
        svg.classList.toggle('hide', noGrid);
        empty.style.display = noGrid ? 'flex' : 'none';
        if (noGrid) {
          chart = null;
          empty.textContent = t('no_grid');
          fit();
          return;
        }
        var n = d.net.length;
        timeFmt = new Intl.DateTimeFormat(lang, { hour: '2-digit', minute: '2-digit', timeZone: d.timeZone });
        var hourFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: d.timeZone });
        dayFmt = new Intl.DateTimeFormat(lang, { weekday: 'short', timeZone: d.timeZone });
        var list = lanes(d);
        var H = TOP + list.length * LANE + AXIS;
        var sw = (X1 - X0) / n;

        svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
        while (svg.firstChild) svg.removeChild(svg.firstChild);

        // Hour labels every 3 or 6 hours; the day name at midnight (no line: a line reads as 'now').
        var every = n <= 112 ? 3 : 6;
        var axisY = TOP + list.length * LANE;
        for (var i = 0; i < n; i += 1) {
          var hm = hourFmt.format(d.startMs + i * d.slotMs).split(':');
          var h = Number(hm[0]);
          if (hm[1] !== '00' || h % every !== 0) continue;
          var x = X0 + i * sw;
          el('text', { x: x, y: axisY + 11, 'text-anchor': 'middle', class: h === 0 ? 'tick day' : 'tick' }, svg,
            h === 0 ? dayFmt.format(d.startMs + i * d.slotMs) : String(h).padStart(2, '0'));
        }

        list.forEach(function (lane, li) {
          var y0 = TOP + li * LANE;
          window.PBTH_PLACE_ICON(svg, lane.icon, 13, y0 + 20, 18, 'var(' + lane.color + ')');
          drawLane(el('g', {}, svg), lane, y0 + 5, y0 + LANE - 5, sw);
        });
        chart = {
          list: list, n: n, sw: sw, axisY: axisY, sel: el('g', {}, svg),
        };
        drawSelection();
        fit();
      }

      // The values and the cursor of the selected slot; the chart itself stays (fast while dragging).
      function drawSelection() {
        var d = data;
        if (!chart || !d || !d.grid) return;
        var idx = selectedMs === null ? 0 : Math.round((selectedMs - d.startMs) / d.slotMs);
        if (idx < 0 || idx >= chart.n) { idx = 0; selectedMs = null; }
        var selTm = d.startMs + idx * d.slotMs;
        var g = chart.sel;
        while (g.firstChild) g.removeChild(g.firstChild);
        // The selected time; at now a hint that the chart can be tapped or dragged.
        el('text', { x: 4, y: 15, class: 'time' }, g, (idx === 0 ? t('now') + ' · ' : dayFmt.format(selTm) + ' ') + timeFmt.format(selTm));
        if (idx === 0) el('text', { x: W - 4, y: 15, 'text-anchor': 'end', class: 'hint' }, g, t('plan_hint'));
        chart.list.forEach(function (lane, li) {
          var y0 = TOP + li * LANE;
          var sub = lane.sub ? lane.sub(idx) : '';
          el('text', { x: 28, y: y0 + (sub ? 19 : 24), class: 'value' }, g, lane.value(idx));
          if (sub) el('text', { x: 28, y: y0 + 31, class: 'sub' }, g, sub.length > 10 ? sub.slice(0, 9) + '…' : sub);
        });
        var cx = X0 + (idx + 0.5) * chart.sw;
        el('line', { x1: cx, x2: cx, y1: TOP - 2, y2: chart.axisY, class: 'cursor' }, g);
      }

      // Height (px) down to the lowest visible element: the body itself can be the frame's height.
      // The first call ends the loading state with it (a height set before ready() does not stick).
      function fit() {
        var bottom = 0;
        Array.prototype.forEach.call(document.body.children, function (e) {
          var r = e.getBoundingClientRect();
          if (r.height) bottom = Math.max(bottom, r.bottom + window.scrollY);
        });
        var hgt = Math.ceil(bottom) + 2;
        if (!ready) {
          ready = true;
          lastHeight = hgt;
          Homey.ready({ height: hgt });
          return;
        }
        if (hgt === lastHeight || typeof Homey.setHeight !== 'function') return;
        lastHeight = hgt;
        Homey.setHeight(hgt).catch(function () {});
      }

      function setIdx(i) {
        var n = data.net.length;
        var k = Math.max(0, Math.min(n - 1, i));
        selectedMs = k === 0 ? null : data.startMs + k * data.slotMs;
        // Right away: requestAnimationFrame lags in the app's widget view.
        drawSelection();
      }

      function chartX(clientX) {
        var r = svg.getBoundingClientRect();
        return ((clientX - r.left) / r.width) * W;
      }

      function select(clientX) {
        if (!data || !data.grid) return;
        setIdx(Math.floor(((chartX(clientX) - X0) / (X1 - X0)) * data.net.length));
      }

      // A tap close beside the cursor steps one slot (15 minutes) that way; further away it jumps there.
      var NEAR = 16; // chart units either side of the cursor
      function tap(clientX) {
        if (!data || !data.grid) return;
        var n = data.net.length;
        var idx = selectedMs === null ? 0 : Math.round((selectedMs - data.startMs) / data.slotMs);
        var dx = chartX(clientX) - (X0 + (idx + 0.5) * ((X1 - X0) / n));
        if (Math.abs(dx) > NEAR) {
          select(clientX);
          return;
        }
        if (Math.abs(dx) < 1) return;
        setIdx(idx + (dx > 0 ? 1 : -1));
        if (typeof Homey.hapticFeedback === 'function') Homey.hapticFeedback();
      }
      // A tap, or a drag along the chart (mouse, pen; in the Homey phone app the app itself takes a
      // drag after a few pixels: pointercancel, seen 16 Nov on Android, also alone on a dashboard and
      // with preventDefault / touch-action none; the widget API has no way to claim it).
      var dragging = false;
      svg.addEventListener('pointerdown', function (evt) {
        dragging = true;
        try { svg.setPointerCapture(evt.pointerId); } catch (e) { /* no capture: still works inside */ }
        tap(evt.clientX);
      });
      svg.addEventListener('pointermove', function (evt) { if (dragging) select(evt.clientX); });
      ['pointerup', 'pointercancel'].forEach(function (type) {
        svg.addEventListener(type, function () { dragging = false; });
      });

      function refresh() {
        if (document.hidden && ready) return;
        Homey.api('GET', '/', {})
          .then(function (d) { data = d; draw(); })
          .catch(function (err) { console.error(err); })
          .finally(function () { if (!ready) fit(); });
      }

      // Per 15-minute slot (now is the left edge), 30 s after the slot change: the plans update first.
      var fetchedSlot = -1;
      function slotNow() { return Math.floor((Date.now() - 30000) / 900000); }
      function tick() {
        if (!document.hidden && slotNow() !== fetchedSlot) { fetchedSlot = slotNow(); refresh(); }
        setTimeout(tick, 900000 - ((Date.now() - 30000) % 900000));
      }
      fetchedSlot = slotNow();
      refresh();
      setTimeout(tick, 900000 - ((Date.now() - 30000) % 900000));
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && slotNow() !== fetchedSlot) { fetchedSlot = slotNow(); refresh(); }
      });
    }

    if (typeof window.Homey !== 'undefined') onHomeyReady(window.Homey);
  </script>
</body>
</html>
