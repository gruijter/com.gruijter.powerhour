<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --text: var(--homey-text-color, #1c1c1e);
      --muted: var(--homey-text-color-light, #8e8e93);
      --line: var(--homey-line-color, rgba(128, 128, 128, 0.25));
      --c-price: #8e8e93;
      --c-cheap: #2eb872;
      --c-normal: rgba(142, 142, 147, 0.45);
      --c-dear: #e5484d;
      --c-grid: #7a86a0;
      --c-export: #2eb872;
      --c-solar: #f2a900;
      --c-battery: #2eb872;
      --c-discharge: #f08c00;
      --c-ev: #8e6cef;
      --c-appliance: #14b8a6;
    }
    @media (prefers-color-scheme: dark) {
      :root { --text: var(--homey-text-color, #f2f2f7); }
    }
    html, body { margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
    .value { fill: var(--text); font-size: 12px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 10px; }
    .time { fill: var(--text); font-size: 12px; font-weight: 600; }
    .tick { fill: var(--muted); font-size: 9px; }
    .base { stroke: var(--line); stroke-width: 1; }
    .cursor { stroke: var(--text); stroke-width: 1; opacity: 0.5; }
    #empty { display: none; padding: 24px 16px; text-align: center; color: var(--muted); font-size: 14px; }
  </style>
  <script src="icons.js"></script>
</head>
<body>
  <svg id="plan" viewBox="0 0 320 300"></svg>
  <div id="empty"></div>
  <script>
    var W = 320;
    var X0 = 78; // chart area; icon and values to its left
    var X1 = 316;
    var TOP = 22; // selected time
    var LANE = 40;
    var AXIS = 16;
    var NS = 'http://www.w3.org/2000/svg';
    var started = false;

    function el(tag, attrs, parent, text) {
      var e = document.createElementNS(NS, tag);
      Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      if (text !== undefined) e.textContent = text;
      if (parent) parent.appendChild(e);
      return e;
    }

    function onHomeyReady(Homey) {
      if (started) return;
      started = true;
      var lang = (typeof Homey.getLanguage === 'function' && Homey.getLanguage()) || navigator.language || 'en';
      if (lang === 'ar') document.documentElement.dir = 'rtl';
      var kw = new Intl.NumberFormat(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      var money = new Intl.NumberFormat(lang, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      var t = function (k) { return Homey.__(k); };
      var svg = document.getElementById('plan');
      var empty = document.getElementById('empty');
      var data = null;
      var selectedMs = null; // null: now
      var lastHeight = 0;
      var ready = false;

      function power(w, signed) {
        if (typeof w !== 'number' || Math.abs(w) < 1) return signed ? '0 W' : '-';
        var a = Math.abs(w);
        var s = a < 1000 ? Math.round(a) + ' W' : kw.format(a / 1000) + ' kW';
        return signed ? (w > 0 ? '+' : '−') + s : s;
      }
      function pct(v) { return typeof v === 'number' ? v + '%' : '-'; }

      // Price levels by thirds of the range: cheap / normal / dear.
      function priceLevel(v, min, max) {
        if (max - min < 1e-6) return '--c-normal';
        var f = (v - min) / (max - min);
        if (f < 1 / 3) return '--c-cheap';
        return f > 2 / 3 ? '--c-dear' : '--c-normal';
      }

      function lanes(d) {
        var list = [];
        if (d.price) {
          list.push({
            icon: 'price', color: '--c-price', kind: 'price', values: d.price,
            value: function (i) { return typeof d.price[i] === 'number' ? money.format(d.price[i]) : '-'; },
            sub: function () { return d.currency || ''; },
          });
        }
        if (d.solar) list.push({ icon: 'solar', color: '--c-solar', kind: 'area', values: d.solar, value: function (i) { return power(d.solar[i]); } });
        if (d.battery) {
          list.push({
            icon: 'battery', color: '--c-battery', down: '--c-discharge', kind: 'soc', values: d.battery, soc: d.soc,
            value: function (i) { return d.soc ? pct(d.soc[i]) : power(d.battery[i], true); },
            sub: function (i) { return d.soc ? power(d.battery[i], true) : ''; },
          });
        }
        if (d.ev) {
          list.push({
            icon: 'ev', color: '--c-ev', kind: 'soc', values: d.ev, soc: d.evSoc,
            value: function (i) { return d.evSoc ? pct(d.evSoc[i]) : power(d.ev[i]); },
            sub: function (i) { return d.evSoc ? power(d.ev[i]) : ''; },
          });
        }
        (d.appliances || []).forEach(function (a) {
          list.push({
            icon: 'appliance', color: '--c-appliance', kind: 'blocks', values: a.w,
            value: function (i) { return power(a.w[i]); },
            sub: function () { return a.name.length > 9 ? a.name.slice(0, 8) + '…' : a.name; },
          });
        });
        list.push({
          icon: 'grid', color: '--c-grid', down: '--c-export', kind: 'signed', values: d.net,
          value: function (i) { return power(d.net[i], true); },
        });
        return list;
      }

      // Step-area path of values (>= 0) scaled to h, rising from baseline y.
      function stepPath(vals, sw, y, h, peak) {
        var p = 'M' + X0 + ' ' + y;
        vals.forEach(function (v, i) {
          var yy = (y - (Math.max(0, v) / peak) * h).toFixed(2);
          p += 'L' + (X0 + i * sw).toFixed(2) + ' ' + yy + 'L' + (X0 + (i + 1) * sw).toFixed(2) + ' ' + yy;
        });
        return p + 'L' + X1 + ' ' + y + 'Z';
      }

      // Runs of slots where test(v) holds, as [start, end) index pairs.
      function runs(vals, test) {
        var out = [];
        var s = -1;
        vals.forEach(function (v, i) {
          if (test(v) && s < 0) s = i;
          if (!test(v) && s >= 0) { out.push([s, i]); s = -1; }
        });
        if (s >= 0) out.push([s, vals.length]);
        return out;
      }

      function band(g, vals, test, color, y, h, sw) {
        runs(vals, test).forEach(function (r) {
          el('rect', { x: X0 + r[0] * sw, y: y, width: (r[1] - r[0]) * sw, height: h, rx: Math.min(2, h / 2), fill: color }, g);
        });
      }

      function drawLane(g, lane, top, bottom, sw) {
        var vals = lane.values.map(function (v) { return typeof v === 'number' ? v : 0; });
        var color = 'var(' + lane.color + ')';
        if (lane.kind === 'price') {
          // One step area per price level: no seams between slots.
          var ps = lane.values.filter(function (v) { return typeof v === 'number'; });
          var min = Math.min.apply(null, ps);
          var max = Math.max.apply(null, ps);
          var base = Math.min(0, min);
          var range = max - base || 1;
          ['--c-cheap', '--c-normal', '--c-dear'].forEach(function (level) {
            var part = lane.values.map(function (v) {
              return typeof v === 'number' && priceLevel(v, min, max) === level ? v - base : 0;
            });
            if (part.some(function (v) { return v > 0; })) el('path', { d: stepPath(part, sw, bottom, bottom - top, range), fill: 'var(' + level + ')' }, g);
          });
          return;
        }
        if (lane.kind === 'area') {
          el('path', { d: stepPath(vals, sw, bottom, bottom - top, Math.max.apply(null, vals) || 1), fill: color, opacity: 0.85 }, g);
          return;
        }
        if (lane.kind === 'blocks') {
          var peak = Math.max.apply(null, vals) || 1;
          runs(vals, function (x) { return x > 0; }).forEach(function (r) {
            var avg = vals.slice(r[0], r[1]).reduce(function (a, b) { return a + b; }, 0) / (r[1] - r[0]);
            el('rect', {
              x: X0 + r[0] * sw, y: top + 6, width: (r[1] - r[0]) * sw, height: bottom - top - 12, rx: 4,
              fill: color, opacity: 0.35 + 0.65 * (avg / peak),
            }, g);
          });
          return;
        }
        if (lane.kind === 'signed') {
          var mid = (top + bottom) / 2;
          var pk = Math.max.apply(null, vals.map(Math.abs)) || 1;
          el('line', { x1: X0, x2: X1, y1: mid, y2: mid, class: 'base' }, g);
          el('path', { d: stepPath(vals, sw, mid, mid - top, pk), fill: color }, g);
          el('path', {
            d: stepPath(vals.map(function (x) { return -x; }), sw, mid, mid - top, pk),
            fill: 'var(' + lane.down + ')', transform: 'translate(0 ' + (2 * mid) + ') scale(1 -1)',
          }, g);
          return;
        }
        // soc: the planned SoC as a line over a light area; charging (discharging) as a band below.
        var bandH = 5;
        var socBottom = bottom - bandH - 2;
        if (lane.soc) {
          var pts = [];
          lane.soc.forEach(function (s, k) {
            if (typeof s === 'number') pts.push([X0 + (k + 0.5) * sw, socBottom - (s / 100) * (socBottom - top)]);
          });
          if (pts.length > 1) {
            var line = pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
            el('polygon', {
              points: pts[0][0].toFixed(1) + ',' + socBottom + ' ' + line + ' ' + pts[pts.length - 1][0].toFixed(1) + ',' + socBottom,
              fill: color, opacity: 0.15,
            }, g);
            el('polyline', { points: line, fill: 'none', stroke: color, 'stroke-width': 1.5, 'stroke-linejoin': 'round' }, g);
          }
        } else {
          el('path', { d: stepPath(vals, sw, socBottom, socBottom - top, Math.max.apply(null, vals) || 1), fill: color, opacity: 0.85 }, g);
        }
        band(g, vals, function (x) { return x > 0; }, color, bottom - bandH, bandH, sw);
        if (lane.down) band(g, vals, function (x) { return x < 0; }, 'var(' + lane.down + ')', bottom - bandH, bandH, sw);
      }

      function draw() {
        var d = data;
        var noGrid = !d || !d.grid;
        svg.style.display = noGrid ? 'none' : '';
        empty.style.display = noGrid ? 'block' : 'none';
        if (noGrid) {
          empty.textContent = t('widget.no_grid');
          fit();
          return;
        }
        var n = d.net.length;
        var list = lanes(d);
        var H = TOP + list.length * LANE + AXIS;
        var sw = (X1 - X0) / n;
        var idx = selectedMs === null ? 0 : Math.round((selectedMs - d.startMs) / d.slotMs);
        if (idx < 0 || idx >= n) { idx = 0; selectedMs = null; }
        var timeFmt = new Intl.DateTimeFormat(lang, { hour: '2-digit', minute: '2-digit', timeZone: d.timeZone });
        var dayFmt = new Intl.DateTimeFormat(lang, { weekday: 'short', timeZone: d.timeZone });
        var hourFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: d.timeZone });

        svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
        while (svg.firstChild) svg.removeChild(svg.firstChild);

        var selTm = d.startMs + idx * d.slotMs;
        el('text', { x: 4, y: 15, class: 'time' }, svg,
          (idx === 0 ? t('ev_now') + ' · ' : dayFmt.format(selTm) + ' ') + timeFmt.format(selTm));

        // Hour labels every 3 or 6 hours; a line only at midnight.
        var every = n <= 112 ? 3 : 6;
        var axisY = TOP + list.length * LANE;
        for (var i = 0; i < n; i += 1) {
          var hm = hourFmt.format(d.startMs + i * d.slotMs).split(':');
          var h = Number(hm[0]);
          if (hm[1] !== '00' || h % every !== 0) continue;
          var x = X0 + i * sw;
          if (h === 0) el('line', { x1: x, x2: x, y1: TOP, y2: axisY, class: 'base' }, svg);
          el('text', { x: x, y: axisY + 11, 'text-anchor': 'middle', class: 'tick' }, svg,
            h === 0 ? dayFmt.format(d.startMs + i * d.slotMs) : String(h).padStart(2, '0'));
        }

        list.forEach(function (lane, li) {
          var y0 = TOP + li * LANE;
          window.PBTH_PLACE_ICON(svg, lane.icon, 13, y0 + 20, 18, 'var(' + lane.color + ')');
          var sub = lane.sub ? lane.sub(idx) : '';
          el('text', { x: 28, y: y0 + (sub ? 19 : 24), class: 'value' }, svg, lane.value(idx));
          if (sub) el('text', { x: 28, y: y0 + 31, class: 'sub' }, svg, sub);
          drawLane(el('g', {}, svg), lane, y0 + 5, y0 + LANE - 5, sw);
        });

        var cx = X0 + (idx + 0.5) * sw;
        el('line', { x1: cx, x2: cx, y1: TOP - 2, y2: axisY, class: 'cursor' }, svg);
        fit();
      }

      // Height (px) down to the lowest visible element: the body itself can be the frame's height.
      // The first call ends the loading state with it (a height set before ready() does not stick).
      function fit() {
        var bottom = 0;
        Array.prototype.forEach.call(document.body.children, function (e) {
          var r = e.getBoundingClientRect();
          if (r.height) bottom = Math.max(bottom, r.bottom + window.scrollY);
        });
        var hgt = Math.ceil(bottom) + 2;
        if (!ready) {
          ready = true;
          lastHeight = hgt;
          Homey.ready({ height: hgt });
          return;
        }
        if (hgt === lastHeight || typeof Homey.setHeight !== 'function') return;
        lastHeight = hgt;
        Homey.setHeight(hgt).catch(function () {});
      }

      function select(clientX) {
        if (!data || !data.grid) return;
        var r = svg.getBoundingClientRect();
        var x = ((clientX - r.left) / r.width) * W;
        var n = data.net.length;
        var i = Math.max(0, Math.min(n - 1, Math.floor(((x - X0) / (X1 - X0)) * n)));
        selectedMs = i === 0 ? null : data.startMs + i * data.slotMs;
        draw();
      }
      // Touch first (the app's web view), mouse/pen as fallback; a tap or a drag along the chart.
      var touchTm = 0;
      svg.addEventListener('touchstart', function (evt) { touchTm = Date.now(); select(evt.touches[0].clientX); }, { passive: true });
      svg.addEventListener('touchmove', function (evt) { select(evt.touches[0].clientX); }, { passive: true });
      svg.addEventListener('mousedown', function (evt) { if (Date.now() - touchTm > 800) select(evt.clientX); });
      svg.addEventListener('mousemove', function (evt) { if (evt.buttons && Date.now() - touchTm > 800) select(evt.clientX); });

      function refresh() {
        if (document.hidden && ready) return;
        Homey.api('GET', '/', {})
          .then(function (d) { data = d; draw(); })
          .catch(function (err) { console.error(err); })
          .finally(function () { if (!ready) fit(); });
      }

      refresh();
      setInterval(refresh, 60000);
      document.addEventListener('visibilitychange', function () { if (!document.hidden) refresh(); });
    }

    if (typeof window.Homey !== 'undefined') onHomeyReady(window.Homey);
  </script>
</body>
</html>
