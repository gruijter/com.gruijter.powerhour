<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="colors.css">
  <style>
    svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
    .time { fill: var(--text); font-size: 12px; font-weight: 600; }
    .value { fill: var(--text); font-size: 12px; font-weight: 600; }
    .sub { fill: var(--muted); font-size: 10px; }
    .tick { fill: var(--muted); font-size: 9px; }
    .tick.day { fill: var(--text); font-weight: 600; }
    .base { stroke: var(--line); stroke-width: 1; }
    .cursor { stroke: var(--text); stroke-width: 1; opacity: 0.5; }
    .now { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
    .tabs { display: flex; gap: 2px; margin: 0 8px 6px; padding: 2px; border-radius: 9px; background: var(--line); }
    .tabs button {
      flex: 1; border: 0; border-radius: 7px; padding: 5px 0; background: transparent;
      color: var(--muted); font: inherit; font-size: 12px; cursor: pointer;
    }
    .tabs button.on { background: var(--node-bg); color: var(--text); font-weight: 600; }
  </style>
  <script src="icons.js"></script>
  <script src="chart.js"></script>
</head>
<body>
  <div class="tabs" id="tabs"></div>
  <div class="chartbox">
    <svg id="plan" viewBox="0 0 320 280"></svg>
    <div id="empty"></div>
  </div>
  <script>
    var W = 320;
    var X0 = 78;
    var X1 = 316;
    var TOP = 22;
    var LANE = 40;
    var AXIS = 16;
    var PALE = 0.4;
    var NS = 'http://www.w3.org/2000/svg';
    var started = false;

    function el(tag, attrs, parent, text) {
      var e = document.createElementNS(NS, tag);
      Object.keys(attrs).forEach(function (k) { e.setAttribute(k, attrs[k]); });
      if (text !== undefined) e.textContent = text;
      if (parent) parent.appendChild(e);
      return e;
    }

    function onHomeyReady(Homey) {
      if (started) return;
      started = true;
      var homeyLang = Homey.__('widget.lang');
      var lang = homeyLang && homeyLang.indexOf('.') < 0 ? homeyLang : (navigator.language || 'en');
      if (lang === 'ar') document.documentElement.dir = 'rtl';
      var kw = new Intl.NumberFormat(lang, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      var money = new Intl.NumberFormat(lang, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      var t = function (k) { return Homey.__('widget.' + k); };
      var svg = document.getElementById('plan');
      var empty = document.getElementById('empty');
      var data = null;
      var selectedMs = null;
      var TABS = ['today', 'tomorrow', 'next'];
      var tabs = document.getElementById('tabs');
      var key = 'pbth-plan-' + (typeof Homey.getWidgetInstanceId === 'function' ? Homey.getWidgetInstanceId() : '');
      var tab = ((typeof Homey.getSettings === 'function' && Homey.getSettings()) || {}).start || 'last';
      if (tab === 'last') {
        tab = 'today';
        try { tab = localStorage.getItem(key) || 'today'; } catch (e) { /* no storage: default */ }
      }
      if (TABS.indexOf(tab) < 0) tab = 'today';
      TABS.forEach(function (id) {
        var b = document.createElement('button');
        b.textContent = t(id);
        b.dataset.id = id;
        b.addEventListener('click', function () {
          if (typeof Homey.hapticFeedback === 'function') Homey.hapticFeedback();
          tab = id;
          try { localStorage.setItem(key, id); } catch (e) { /* not kept */ }
          selectedMs = null;
          markTabs();
          refresh();
        });
        tabs.appendChild(b);
      });
      function markTabs() {
        Array.prototype.forEach.call(tabs.children, function (b) { b.classList.toggle('on', b.dataset.id === tab); });
      }
      markTabs();
      function nowIdx(d) {
        if (d.day === 'tomorrow') return -1;
        return d.day === 'today' ? Math.min(d.past || 0, d.net.length - 1) : 0;
      }
      function defaultIdx(d) { return Math.max(0, nowIdx(d)); }
      function currentIdx() {
        return selectedMs === null ? defaultIdx(data) : Math.round((selectedMs - data.startMs) / data.slotMs);
      }
      var lastHeight = 0;
      var ready = false;

      function power(w, signed) {
        if (typeof w !== 'number' || Math.abs(w) < 1) return signed ? '0 W' : '-';
        var a = Math.abs(w);
        var s = a < 1000 ? Math.round(a) + ' W' : kw.format(a / 1000) + ' kW';
        return signed ? (w > 0 ? '+' : '−') + s : s;
      }
      function pct(v) { return typeof v === 'number' ? v + '%' : '-'; }

      function lanes(d) {
        var list = [];
        if (d.price) {
          list.push({
            icon: 'price', color: '--c-price', kind: 'price', values: d.price, forecast: d.priceForecast || [], levels: d.priceLevel || [], alphas: d.priceAlpha || [],
            value: function (i) { return typeof d.price[i] === 'number' ? money.format(d.price[i]) + (d.currency ? ' ' + d.currency : '') : '-'; },
          });
        }
        if (d.solar) list.push({ icon: 'solar', color: '--c-solar', kind: 'area', values: d.solar, value: function (i) { return power(d.solar[i]); } });
        if (d.battery) {
          list.push({
            icon: 'battery', color: '--c-battery', kind: 'soc', values: d.battery, soc: d.soc, max: d.batteryMax, blocks: d.batteryBlock,
            value: function (i) { return d.soc ? pct(d.soc[i]) : power(d.battery[i], true); },
            sub: function (i) { return d.soc ? power(d.battery[i], true) : ''; },
          });
        }
        if (d.ev) {
          list.push({
            icon: 'ev', color: '--c-ev', kind: 'soc', values: d.ev, soc: d.evSoc, max: d.evMax,
            value: function (i) { return d.evSoc ? pct(d.evSoc[i]) : power(d.ev[i]); },
            sub: function (i) { return d.evSoc ? power(d.ev[i]) : ''; },
          });
        }
        var apps = d.appliances || [];
        if (apps.length) {
          list.push({
            icon: 'appliance', color: '--c-appliance', kind: 'apps', apps: apps,
            value: function (i) {
              return power(apps.reduce(function (sum, a) { return sum + (a.w[i] || 0); }, 0));
            },
            sub: function (i) {
              var on = apps.filter(function (a) { return a.w[i] > 0; });
              if (on.length) return on[0].name + (on.length > 1 ? ' +' + (on.length - 1) : '');
              var next = null;
              apps.forEach(function (a) {
                for (var k = i + 1; k < a.w.length; k += 1) {
                  if (a.w[k] > 0) {
                    if (!next || k < next.k) next = { k: k, name: a.name };
                    return;
                  }
                }
              });
              return next ? timeFmt.format(d.startMs + next.k * d.slotMs) + ' ' + next.name : '';
            },
          });
        }
        list.push({
          icon: 'grid', color: '--c-grid', kind: 'signed', values: d.net,
          value: function (i) { return power(d.net[i]); },
          sub: function (i) {
            if (typeof d.net[i] !== 'number' || Math.abs(d.net[i]) < 1) return '';
            return t(d.net[i] > 0 ? 'import' : 'export');
          },
        });
        return list;
      }

      function stepPath(vals, sw, y, h, peak) {
        var p = 'M' + X0 + ' ' + y;
        vals.forEach(function (v, i) {
          var yy = (y - (Math.max(0, v) / peak) * h).toFixed(2);
          p += 'L' + (X0 + i * sw).toFixed(2) + ' ' + yy + 'L' + (X0 + (i + 1) * sw).toFixed(2) + ' ' + yy;
        });
        return p + 'L' + X1 + ' ' + y + 'Z';
      }

      var monoPath = window.PbthMonoPath;

      function runs(vals, test) {
        var out = [];
        var s = -1;
        vals.forEach(function (v, i) {
          if (test(v) && s < 0) s = i;
          if (!test(v) && s >= 0) { out.push([s, i]); s = -1; }
        });
        if (s >= 0) out.push([s, vals.length]);
        return out;
      }

      function powerBand(g, vals, y, h, sw, max, blocks) {
        max = max || {};
        var seg = null;
        var flush = function () {
          if (seg) {
            el('rect', {
              x: X0 + seg.from * sw, y: y, width: (seg.to - seg.from) * sw, height: h, fill: seg.fill, opacity: seg.alpha,
            }, g);
          }
          seg = null;
        };
        vals.forEach(function (v, i) {
          var block = blocks && blocks[i];
          if (!v && block !== 'hold') { flush(); return; }
          var fill = 'var(--c-hold)';
          if (block !== 'hold') fill = v > 0 ? 'var(--c-use)' : (block === 'xom' ? 'var(--c-xom)' : 'var(--c-export)');
          var top = v > 0 ? max.charge : max.discharge;
          var alpha = v && top > 0 ? Math.round((0.7 + 0.3 * Math.min(1, Math.abs(v) / top)) * 20) / 20 : 1;
          if (seg && seg.fill === fill && seg.alpha === alpha && seg.to === i) {
            seg.to = i + 1;
            return;
          }
          flush();
          seg = { from: i, to: i + 1, fill: fill, alpha: alpha };
        });
        flush();
      }

      function drawLane(g, lane, top, bottom, sw) {
        var color = 'var(' + lane.color + ')';
        if (lane.kind === 'apps') {
          var rowH = (bottom - top - 4) / lane.apps.length;
          lane.apps.forEach(function (a, ai) {
            var peak = Math.max.apply(null, a.w) || 1;
            runs(a.w, function (x) { return x > 0; }).forEach(function (r) {
              var avg = a.w.slice(r[0], r[1]).reduce(function (x, y) { return x + y; }, 0) / (r[1] - r[0]);
              el('rect', {
                x: X0 + r[0] * sw, y: top + 2 + ai * rowH + 1, width: (r[1] - r[0]) * sw, height: Math.max(2, rowH - 2), rx: Math.min(4, rowH / 2),
                fill: color, opacity: 0.7 + 0.3 * (avg / peak),
              }, g);
            });
          });
          return;
        }
        var vals = lane.values.map(function (v) { return typeof v === 'number' ? v : 0; });
        if (lane.kind === 'price') {
          var ps = lane.values.filter(function (v) { return typeof v === 'number'; });
          if (!ps.length) return;
          var base = Math.min(0, Math.min.apply(null, ps));
          var range = Math.max.apply(null, ps) - base || 1;
          var groups = {};
          lane.values.forEach(function (v, i) {
            if (typeof v !== 'number') return;
            var lv = lane.levels[i] || 'normal';
            var alpha = (lane.forecast[i] ? PALE : 1) * ((lane.alphas && lane.alphas[i]) || 1);
            var key = lv + '|' + alpha;
            if (!groups[key]) groups[key] = { lv: lv, alpha: alpha, part: lane.values.map(function () { return 0; }) };
            groups[key].part[i] = v - base;
          });
          Object.keys(groups).forEach(function (key) {
            var gr = groups[key];
            if (gr.part.some(function (v) { return v > 0; })) {
              el('path', { d: stepPath(gr.part, sw, bottom, bottom - top, range), fill: 'var(--c-' + gr.lv + ')', opacity: gr.alpha }, g);
            }
          });
          return;
        }
        if (lane.kind === 'area') {
          var apeak = Math.max.apply(null, vals) || 1;
          var past = data.day === 'today' ? Math.min(data.past || 0, vals.length) : 0;
          if (past < vals.length) {
            var ahead = vals.map(function (v, i) { return i < past ? 0 : v; });
            el('path', { d: stepPath(ahead, sw, bottom, bottom - top, apeak), fill: color, opacity: 0.4 }, g);
          }
          if (past > 0) {
            var line = vals.slice(0, past).map(function (v, i) { return [X0 + (i + 0.5) * sw, bottom - (Math.max(0, v) / apeak) * (bottom - top)]; });
            var lp = monoPath(line);
            el('path', { d: lp + 'L' + line[line.length - 1][0].toFixed(2) + ' ' + bottom + 'L' + line[0][0].toFixed(2) + ' ' + bottom + 'Z', fill: color, opacity: 0.5 }, g);
            el('path', { d: lp, fill: 'none', stroke: color, 'stroke-width': 1, 'stroke-linejoin': 'round' }, g);
          }
          return;
        }
        if (lane.kind === 'signed') {
          var mid = (top + bottom) / 2;
          var pk = Math.max.apply(null, vals.map(Math.abs)) || 1;
          var gpast = Math.min(data.past || 0, vals.length);
          el('line', { x1: X0, x2: X1, y1: mid, y2: mid, class: 'base' }, g);
          [[function (i) { return i < gpast; }, 1], [function (i) { return i >= gpast; }, PALE]].forEach(function (part) {
            var pv = vals.map(function (v, i) { return part[0](i) ? v : 0; });
            el('path', { d: stepPath(pv, sw, mid, mid - top, pk), fill: 'var(--c-use)', opacity: part[1] }, g);
            el('path', {
              d: stepPath(pv.map(function (x) { return -x; }), sw, mid, mid - top, pk),
              fill: 'var(--c-export)', opacity: part[1], transform: 'translate(0 ' + (2 * mid) + ') scale(1 -1)',
            }, g);
          });
          return;
        }
        var bandH = 7;
        var socBottom = bottom - bandH - 2;
        if (lane.soc) {
          var pts = [];
          lane.soc.forEach(function (s, k) {
            if (typeof s === 'number') pts.push([X0 + (k + 0.5) * sw, socBottom - (s / 100) * (socBottom - top)]);
          });
          if (pts.length > 1) {
            var line = pts.map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
            var spast = data.past || 0;
            var cut = X0 + spast * sw;
            el('polygon', {
              points: pts[0][0].toFixed(1) + ',' + socBottom + ' ' + line + ' ' + pts[pts.length - 1][0].toFixed(1) + ',' + socBottom,
              fill: color, opacity: 0.15,
            }, g);
            var seen = pts.filter(function (p) { return p[0] <= cut + sw / 2; });
            var plan = pts.filter(function (p) { return p[0] >= cut - sw / 2; });
            [[seen, 'none'], [plan, '4 3']].forEach(function (part) {
              if (part[0].length < 2) return;
              el('polyline', {
                points: part[0].map(function (p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' '),
                fill: 'none', stroke: color, 'stroke-width': 1.5, 'stroke-dasharray': part[1], 'stroke-linejoin': 'round',
              }, g);
            });
          }
        } else {
          el('path', { d: stepPath(vals, sw, socBottom, socBottom - top, Math.max.apply(null, vals) || 1), fill: 'var(--c-use)', opacity: 0.85 }, g);
        }
        powerBand(g, vals, bottom - bandH, bandH, sw, lane.max, lane.blocks);
      }

      var settings = (typeof Homey.getSettings === 'function' && Homey.getSettings()) || {};
      if (typeof Homey.onSettings === 'function') Homey.onSettings(function (x) { settings = x || settings; draw(); });
      var timeFmt = null;
      var dayFmt = null;
      var chart = null;

      function draw() {
        var d = data;
        W = settings.shape !== 'normal' ? 480 : 320;
        X1 = W - 4;
        LANE = settings.shape !== 'normal' ? 34 : 40;
        var noGrid = !d || !d.grid;
        svg.classList.toggle('hide', noGrid);
        empty.style.display = noGrid ? 'flex' : 'none';
        if (noGrid) {
          chart = null;
          empty.textContent = t('no_grid');
          fit();
          return;
        }
        var n = d.net.length;
        timeFmt = new Intl.DateTimeFormat(lang, { hour: '2-digit', minute: '2-digit', timeZone: d.timeZone });
        var hourFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', hourCycle: 'h23', timeZone: d.timeZone });
        dayFmt = new Intl.DateTimeFormat(lang, { weekday: 'short', timeZone: d.timeZone });
        var list = lanes(d);
        var H = TOP + list.length * LANE + AXIS;
        var sw = (X1 - X0) / n;

        svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
        while (svg.firstChild) svg.removeChild(svg.firstChild);

        var every = n <= 112 ? 3 : 6;
        var axisY = TOP + list.length * LANE;
        for (var i = 0; i < n; i += 1) {
          var hm = hourFmt.format(d.startMs + i * d.slotMs).split(':');
          var h = Number(hm[0]);
          if (hm[1] !== '00' || h % every !== 0) continue;
          var x = X0 + i * sw;
          el('text', { x: x, y: axisY + 11, 'text-anchor': 'middle', class: h === 0 ? 'tick day' : 'tick' }, svg,
            h === 0 ? dayFmt.format(d.startMs + i * d.slotMs) : String(h).padStart(2, '0'));
        }

        list.forEach(function (lane, li) {
          var y0 = TOP + li * LANE;
          window.PBTH_PLACE_ICON(svg, lane.icon, 13, y0 + 20, 18, 'var(' + lane.color + ')');
          drawLane(el('g', {}, svg), lane, y0 + 5, y0 + LANE - 5, sw);
        });
        if (d.day === 'today' && nowIdx(d) > 0) {
          var nx = X0 + nowIdx(d) * sw;
          el('line', { x1: nx, x2: nx, y1: TOP - 2, y2: axisY, class: 'now' }, svg);
        }
        chart = {
          list: list, n: n, sw: sw, axisY: axisY, sel: el('g', {}, svg),
        };
        drawSelection();
        fit();
      }

      function drawSelection() {
        var d = data;
        if (!chart || !d || !d.grid) return;
        var idx = currentIdx();
        if (idx < 0 || idx >= chart.n) { idx = defaultIdx(d); selectedMs = null; }
        var selTm = d.startMs + idx * d.slotMs;
        var g = chart.sel;
        while (g.firstChild) g.removeChild(g.firstChild);
        el('text', { x: 4, y: 15, class: 'time' }, g, (idx === nowIdx(d) ? t('now') + ' · ' : dayFmt.format(selTm) + ' ') + timeFmt.format(selTm));
        chart.list.forEach(function (lane, li) {
          var y0 = TOP + li * LANE;
          var sub = lane.sub ? lane.sub(idx) : '';
          el('text', { x: 28, y: y0 + (sub ? 19 : 24), class: 'value' }, g, lane.value(idx));
          if (sub) el('text', { x: 28, y: y0 + 31, class: 'sub' }, g, sub.length > 10 ? sub.slice(0, 9) + '…' : sub);
        });
        var cx = X0 + (idx + 0.5) * chart.sw;
        el('line', { x1: cx, x2: cx, y1: TOP - 2, y2: chart.axisY, class: 'cursor' }, g);
      }

      function fit() {
        var bottom = 0;
        Array.prototype.forEach.call(document.body.children, function (e) {
          var r = e.getBoundingClientRect();
          if (r.height) bottom = Math.max(bottom, r.bottom + window.scrollY);
        });
        var hgt = Math.ceil(bottom) + 2;
        if (!ready) {
          ready = true;
          lastHeight = hgt;
          Homey.ready({ height: hgt });
          return;
        }
        if (hgt === lastHeight || typeof Homey.setHeight !== 'function') return;
        lastHeight = hgt;
        Homey.setHeight(hgt).catch(function () {});
      }

      function setIdx(i) {
        var n = data.net.length;
        var k = Math.max(0, Math.min(n - 1, i));
        selectedMs = k === defaultIdx(data) ? null : data.startMs + k * data.slotMs;
        drawSelection();
      }

      function chartX(clientX) {
        var r = svg.getBoundingClientRect();
        return ((clientX - r.left) / r.width) * W;
      }

      function select(clientX) {
        if (!data || !data.grid) return;
        setIdx(Math.floor(((chartX(clientX) - X0) / (X1 - X0)) * data.net.length));
      }

      function inChart(evt) {
        var r = svg.getBoundingClientRect();
        var k = r.width / W;
        var x = (evt.clientX - r.left) / k;
        var y = (evt.clientY - r.top) / k;
        return x >= X0 && x <= X1 && y >= TOP - 2 && y <= chart.axisY;
      }
      var dragging = false;
      document.addEventListener('pointerdown', function (evt) {
        if (!chart || !data || !data.grid || evt.target.closest('#tabs')) return;
        if (evt.target.closest('#plan') && inChart(evt)) {
          dragging = true;
          try { svg.setPointerCapture(evt.pointerId); } catch (e) { /* no capture: still works inside */ }
          select(evt.clientX);
        } else {
          if (selectedMs === null) return;
          selectedMs = null;
          drawSelection();
        }
        if (typeof Homey.hapticFeedback === 'function') Homey.hapticFeedback();
      });
      svg.addEventListener('pointermove', function (evt) { if (dragging) select(evt.clientX); });
      ['pointerup', 'pointercancel'].forEach(function (type) {
        svg.addEventListener(type, function () { dragging = false; });
      });

      function refresh() {
        if (document.hidden && ready) return;
        var asked = tab;
        Homey.api('GET', '/?day=' + asked, {})
          .then(function (d) {
            if (asked !== tab) return;
            data = d;
            draw();
          })
          .catch(function (err) { console.error(err); })
          .finally(function () { if (!ready) fit(); });
      }

      var fetchedSlot = -1;
      function slotNow() { return Math.floor((Date.now() - 30000) / 900000); }
      function tick() {
        if (!document.hidden && slotNow() !== fetchedSlot) { fetchedSlot = slotNow(); refresh(); }
        setTimeout(tick, 900000 - ((Date.now() - 30000) % 900000));
      }
      fetchedSlot = slotNow();
      refresh();
      setTimeout(tick, 900000 - ((Date.now() - 30000) % 900000));
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden && slotNow() !== fetchedSlot) { fetchedSlot = slotNow(); refresh(); }
      });
    }

    if (typeof window.Homey !== 'undefined') onHomeyReady(window.Homey);
  </script>
</body>
</html>
