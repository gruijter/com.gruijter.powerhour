<form class="homey-form" onsubmit="return false;" data-view="setup">
	<fieldset class="homey-form-fieldset" data-part="main">
		<legend class="homey-form-legend" data-part="title"></legend>
		<div data-part="settings"></div>
		<fieldset class="homey-form-checkbox-set" data-part="checkboxes"></fieldset>
	</fieldset>
	<fieldset class="homey-form-fieldset" data-part="budgetSection" style="display: none;">
		<legend class="homey-form-legend" data-part="budgetTitle"></legend>
		<div data-part="budget"></div>
	</fieldset>
	<fieldset class="homey-form-fieldset" data-part="rolesSection" style="display: none;">
		<legend class="homey-form-legend" data-part="rolesTitle"></legend>
		<p class="homey-subtitle" data-part="rolesText"></p>
		<div data-part="roles"></div>
	</fieldset>
	<button class="homey-button-primary-full" data-part="next" data-i18n="repair.setup_next"></button>
</form>

<script>
	// The same file as setup.html (pair/ and repair/) and, with VIEW and data-view 'budget' (only the
	// year section), as budget.html (repair/) of each driver with a setup view (lib/helpers/PairSetup.js).
	// Own scope and parts looked up in its own form: the views of a repair session share one document.
	(() => {
		const VIEW = 'setup';
		const forms = document.querySelectorAll(`form[data-view="${VIEW}"]`);
		const root = forms[forms.length - 1];
		const part = (name) => root.querySelector(`[data-part="${name}"]`);
		const input = (id) => root.querySelector(`#set_${id}`);
		Homey.setTitle(Homey.__(VIEW === 'budget' ? 'repair.start_budget' : 'repair.setup_title'));
		let roleDeviceId = null;
		let settingDefs = [];

		const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);

		const option = (value, text, selected) => el('option', { value: String(value), textContent: text, selected: String(value) === String(selected) });

		// One driver setting: a checkbox (in the checkbox set) or a group with a number, text or dropdown.
		// A setting with a section goes there in its own order (checkboxes too), and with showIf only
		// shows while that other setting has that value.
		const settingField = (s) => {
			const section = s.section ? part(s.section) : null;
			if (s.type === 'checkbox') {
				const set = section ? el('fieldset', { className: 'homey-form-checkbox-set', id: `grp_${s.id}` }) : part('checkboxes');
				const label = el('label', { className: 'homey-form-checkbox' });
				label.appendChild(el('input', {
					className: 'homey-form-checkbox-input', type: 'checkbox', id: `set_${s.id}`, checked: !!s.value,
				}));
				label.appendChild(el('span', { className: 'homey-form-checkbox-checkmark' }));
				label.appendChild(el('span', { className: 'homey-form-checkbox-text', textContent: s.label }));
				set.appendChild(label);
				if (s.info) set.appendChild(el('p', { className: 'homey-subtitle', textContent: s.info }));
				if (section) section.appendChild(set);
				return;
			}
			const group = el('div', { className: 'homey-form-group', id: `grp_${s.id}` });
			group.appendChild(el('label', { className: 'homey-form-label', htmlFor: `set_${s.id}`, textContent: s.label }));
			if (s.type === 'dropdown') {
				const select = el('select', { className: 'homey-form-select', id: `set_${s.id}` });
				s.options.forEach((opt) => select.appendChild(option(opt.id, opt.label, s.value)));
				group.appendChild(select);
			} else {
				const field = el('input', {
					className: 'homey-form-input', type: s.type === 'number' ? 'number' : 'text', id: `set_${s.id}`, value: s.value,
				});
				if (s.type === 'number') field.step = 'any'; // decimals (e.g. 5.05 kWh): step 1 would reject them
				if (typeof s.min === 'number') field.min = s.min;
				if (typeof s.max === 'number') field.max = s.max;
				group.appendChild(field);
			}
			if (s.info) group.appendChild(el('p', { className: 'homey-subtitle', textContent: s.info }));
			(section || part('settings')).appendChild(group);
		};

		// Per role a dropdown: automatic, none, or one of the fitting capabilities. A role with a mode
		// ('watt' or 'meter') shows only when "Use Watt as source" is on or off.
		const roleField = (role) => {
			const group = el('div', { className: 'homey-form-group' });
			if (role.mode) group.dataset.mode = role.mode;
			group.appendChild(el('label', { className: 'homey-form-label', htmlFor: `role_${role.key}`, textContent: role.label }));
			const select = el('select', { className: 'homey-form-select', id: `role_${role.key}` });
			select.dataset.role = role.key;
			select.appendChild(option('auto', `${Homey.__('repair.setup_auto')} (${role.auto || Homey.__('repair.setup_none')})`, role.selected));
			if (!role.noNone) select.appendChild(option('none', Homey.__('repair.setup_none'), role.selected));
			role.options.forEach((opt) => select.appendChild(option(opt.id, opt.label, role.selected)));
			group.appendChild(select);
			part('roles').appendChild(group);
		};

		const shown = (s) => {
			if (!s.showIf) return true;
			const parent = settingDefs.find((p) => p.id === s.showIf.id);
			const field = input(s.showIf.id);
			if (!parent || !field || !shown(parent)) return false;
			return (parent.type === 'checkbox' ? field.checked : field.value) === s.showIf.value;
		};
		const showDependent = () => {
			settingDefs.filter((s) => s.showIf).forEach((s) => {
				const group = root.querySelector(`#grp_${s.id}`);
				if (group) group.style.display = shown(s) ? '' : 'none';
			});
		};

		const showRoleModes = () => {
			const watt = input('use_measure_source');
			const mode = watt && watt.checked ? 'watt' : 'meter';
			root.querySelectorAll('[data-part="roles"] [data-mode]').forEach((group) => {
				group.style.display = group.dataset.mode === mode ? '' : 'none';
			});
		};

		async function load() {
			try {
				const data = await Homey.emit(`${VIEW}_get`);
				part('title').textContent = data.title || '';
				settingDefs = data.settings || [];
				if (!settingDefs.some((s) => !s.section)) part('main').style.display = 'none';
				if (settingDefs.some((s) => s.section === 'budget')) {
					part('budgetSection').style.display = '';
					part('budgetTitle').textContent = data.budgetTitle || '';
				}
				settingDefs.forEach(settingField);
				showDependent();
				settingDefs.forEach((s) => {
					const field = input(s.id);
					if (field) field.addEventListener('change', showDependent);
				});
				if (!data.roles) return;
				roleDeviceId = data.roles.deviceId;
				part('rolesSection').style.display = '';
				part('rolesTitle').textContent = data.roles.title || '';
				part('rolesText').textContent = data.roles.text || '';
				data.roles.items.forEach(roleField);
				showRoleModes();
				const watt = input('use_measure_source');
				if (watt) watt.addEventListener('change', showRoleModes);
			} catch (error) {
				Homey.alert(error.message || error, 'error');
			} finally {
				Homey.hideLoadingOverlay();
			}
		}

		part('next').addEventListener('click', async () => {
			const button = part('next');
			if (button.classList.contains('is-loading')) return;
			button.classList.add('is-loading');
			try {
				const settings = {};
				settingDefs.forEach((s) => {
					const field = input(s.id);
					settings[s.id] = s.type === 'checkbox' ? field.checked : field.value;
				});
				const caps = {};
				root.querySelectorAll('select[data-role]').forEach((select) => {
					caps[select.dataset.role] = select.value;
				});
				// Pairing returns the device to create; repair continues to its 'loading' view.
				const result = await Homey.emit(`${VIEW}_set`, { settings, roleDeviceId, caps });
				if (result && result.device) {
					await Homey.createDevice(result.device);
					Homey.done();
					return;
				}
				Homey.showView('loading');
			} catch (error) {
				button.classList.remove('is-loading');
				Homey.alert(error.message || error, 'error');
			}
		});

		load();
	})();
</script>
