<form class="homey-form" onsubmit="return false;">
	<fieldset class="homey-form-fieldset">
		<legend class="homey-form-legend" data-i18n="repair.setup_charger"></legend>
		<div id="settings"></div>
		<fieldset class="homey-form-checkbox-set" id="checkboxes"></fieldset>
	</fieldset>
	<fieldset class="homey-form-fieldset" id="carSection" style="display: none;">
		<legend class="homey-form-legend" data-i18n="repair.car_caps_title"></legend>
		<p class="homey-subtitle" id="carText"></p>
		<div id="roles"></div>
	</fieldset>
	<p class="homey-subtitle" id="noCar" style="display: none;" data-i18n="repair.car_no_car"></p>
	<button class="homey-button-primary-full" id="next" data-i18n="repair.car_next"></button>
</form>

<script>
	Homey.setTitle(Homey.__('repair.setup_title'));
	let carId = null;

	const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);

	const option = (value, text, selected) => el('option', { value: String(value), textContent: text, selected: String(value) === String(selected) });

	const describe = (opt) => {
		const value = opt.value === null || opt.value === undefined ? '' : `: ${opt.value}${opt.units ? ` ${opt.units}` : ''}`;
		return `${opt.title} (${opt.id})${value}`;
	};

	// One driver setting: a checkbox (in the checkbox set) or a group with a number or dropdown.
	const settingField = (s) => {
		if (s.type === 'checkbox') {
			const label = el('label', { className: 'homey-form-checkbox' });
			label.appendChild(el('input', {
				className: 'homey-form-checkbox-input', type: 'checkbox', id: `set_${s.id}`, checked: !!s.value,
			}));
			label.appendChild(el('span', { className: 'homey-form-checkbox-checkmark' }));
			label.appendChild(el('span', { className: 'homey-form-checkbox-text', textContent: s.label }));
			document.getElementById('checkboxes').appendChild(label);
			return;
		}
		const group = el('div', { className: 'homey-form-group' });
		group.appendChild(el('label', { className: 'homey-form-label', htmlFor: `set_${s.id}`, textContent: s.label }));
		if (s.type === 'dropdown') {
			const select = el('select', { className: 'homey-form-select', id: `set_${s.id}` });
			s.options.forEach((opt) => select.appendChild(option(opt.id, opt.label, s.value)));
			group.appendChild(select);
		} else {
			const input = el('input', {
				className: 'homey-form-input', type: 'number', id: `set_${s.id}`, value: s.value,
			});
			if (typeof s.min === 'number') input.min = s.min;
			if (typeof s.max === 'number') input.max = s.max;
			group.appendChild(input);
		}
		if (s.info) group.appendChild(el('p', { className: 'homey-subtitle', textContent: s.info }));
		document.getElementById('settings').appendChild(group);
	};

	let settingDefs = [];

	async function load() {
		try {
			const data = await Homey.emit('setup_get');
			settingDefs = data.settings || [];
			settingDefs.forEach(settingField);
			if (!data.car) {
				document.getElementById('noCar').style.display = '';
				return;
			}
			carId = data.carId;
			document.getElementById('carSection').style.display = '';
			document.getElementById('carText').textContent = `${data.car}. ${Homey.__('repair.car_caps_text')}`;
			const roles = document.getElementById('roles');
			data.roles.forEach((role) => {
				const group = el('div', { className: 'homey-form-group' });
				group.appendChild(el('label', {
					className: 'homey-form-label', htmlFor: `role_${role.key}`, textContent: Homey.__(`repair.car_${role.key}`),
				}));
				const select = el('select', { className: 'homey-form-select', id: `role_${role.key}` });
				select.dataset.role = role.key;
				select.appendChild(option('auto', `${Homey.__('repair.car_auto')} (${role.auto || Homey.__('repair.car_none')})`, role.selected));
				select.appendChild(option('none', Homey.__('repair.car_none'), role.selected));
				role.options.forEach((opt) => select.appendChild(option(opt.id, describe(opt), role.selected)));
				group.appendChild(select);
				roles.appendChild(group);
			});
		} catch (error) {
			Homey.alert(error.message || error, 'error');
		} finally {
			Homey.hideLoadingOverlay();
		}
	}

	document.getElementById('next').addEventListener('click', async () => {
		const button = document.getElementById('next');
		if (button.classList.contains('is-loading')) return;
		button.classList.add('is-loading');
		try {
			const settings = {};
			settingDefs.forEach((s) => {
				const input = document.getElementById(`set_${s.id}`);
				settings[s.id] = s.type === 'checkbox' ? input.checked : Number(input.value);
			});
			const caps = {};
			document.querySelectorAll('select[data-role]').forEach((select) => {
				caps[select.dataset.role] = select.value;
			});
			// Pairing returns the device to create; repair continues to its 'loading' view.
			const result = await Homey.emit('setup_set', { settings, carId, caps });
			if (result && result.device) {
				await Homey.createDevice(result.device);
				Homey.done();
				return;
			}
			Homey.showView('loading');
		} catch (error) {
			button.classList.remove('is-loading');
			Homey.alert(error.message || error, 'error');
		}
	});

	load();
</script>
