<form class="homey-form" onsubmit="return false;" data-view="repair_start">
	<fieldset class="homey-form-fieldset">
		<legend class="homey-form-legend" data-i18n="repair.start_question"></legend>
		<fieldset class="homey-form-radio-set" id="choice"></fieldset>
	</fieldset>
	<div class="pbth-nav-space"></div>
	<div class="pbth-nav" style="justify-content: flex-end;">
		<button class="homey-button-primary pbth-next" id="startNext"><span id="startNextText"></span><span class="homey-icon-arrow-right"></span></button>
	</div>
</form>
<style>
	/* Previous and Next fixed at the bottom, like Homey's own views (no Homey class for it). */
	.pbth-nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center; padding: var(--homey-su-2); background: var(--homey-color-white); }
	.pbth-prev { padding-left: 0; color: var(--homey-color-mono-60); }
	.pbth-next { width: 50%; }
	.pbth-nav-space { height: 88px; }
</style>

<script>
	// The same file in repair/ of each driver with a setup view (lib/helpers/PairSetup.js).
	// Own scope and its own form: the views of a repair session share one document (repair_start can
	// show twice).
	(() => {
		const forms = document.querySelectorAll('form[data-view="repair_start"]');
		const root = forms[forms.length - 1];
		Homey.setTitle(Homey.__('repair.start_title'));
		root.querySelector('#startNextText').textContent = Homey.__('repair.nav_next');
		const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);
		const set = root.querySelector('#choice');
		// The choices from the driver: source, price, other settings, and per device fix values and the year budget.
		Homey.emit('start_get').then((choices) => {
			choices.forEach((c, i) => {
				const label = el('label', { className: 'homey-form-radio' });
				label.appendChild(el('input', {
					className: 'homey-form-radio-input', type: 'radio', name: 'choice', value: c.id, checked: i === 0,
				}));
				label.appendChild(el('span', { className: 'homey-form-radio-checkmark' }));
				label.appendChild(el('span', { className: 'homey-form-radio-text', textContent: c.label }));
				set.appendChild(label);
				set.appendChild(el('p', { className: 'homey-subtitle', textContent: c.info }));
			});
		}).catch((error) => Homey.alert(error.message || error, 'error'));

		root.querySelector('#startNext').addEventListener('click', () => {
			const checked = root.querySelector('input[name="choice"]:checked');
			if (!checked) return;
			Homey.emit('start_set', checked.value).then((view) => Homey.showView(view))
				.catch((error) => Homey.alert(error.message || error, 'error'));
		});
		Homey.hideLoadingOverlay();
	})();
</script>
