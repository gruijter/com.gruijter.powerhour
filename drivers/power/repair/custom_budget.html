<form class="homey-form" onsubmit="return false;" data-view="custom_budget">
	<fieldset class="homey-form-fieldset">
		<legend class="homey-form-legend" data-part="title"></legend>
		<p class="homey-subtitle" data-i18n="budget.custom_text"></p>
		<div style="display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center;">
			<label class="homey-form-label" for="customTotal" data-part="totalLabel" style="margin: 0;"></label>
			<input class="homey-form-input" type="number" step="any" min="0" id="customTotal" data-part="total" style="box-sizing: border-box; width: 100%; min-width: 0; margin: 0;">
			<label class="homey-form-label" for="customSpread" data-i18n="budget.custom_spread" style="margin: 0;"></label>
			<select class="homey-form-select" id="customSpread" data-part="spread" style="box-sizing: border-box; width: 100%; min-width: 0; margin: 0;"></select>
		</div>
	</fieldset>
	<fieldset class="homey-form-fieldset">
		<legend class="homey-form-legend" data-i18n="budget.custom_months"></legend>
		<div data-part="months" style="display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 8px 12px; align-items: center;"></div>
		<p class="homey-subtitle" data-part="sum"></p>
	</fieldset>
	<button class="homey-button-primary-full" data-part="next" data-i18n="repair.setup_next"></button>
</form>

<script>
	// The same file in pair/ and repair/ of each driver with a year budget: the 12 months of a Custom
	// budget (lib/helpers/PairSetup.js). Own scope and parts in its own form: the views of a session
	// share one document.
	(() => {
		const forms = document.querySelectorAll('form[data-view="custom_budget"]');
		const root = forms[forms.length - 1];
		const part = (name) => root.querySelector(`[data-part="${name}"]`);
		Homey.setTitle(Homey.__('budget.custom_title'));
		const el = (tag, props = {}) => Object.assign(document.createElement(tag), props);
		let unit = '';
		let inputs = [];

		const round = (v) => Math.round(v * 10) / 10;
		const showSum = () => {
			const sum = inputs.reduce((a, input) => a + (Number(String(input.value).replace(',', '.')) || 0), 0);
			part('sum').textContent = `${Homey.__('budget.custom_sum')}: ${round(sum)} ${unit}`;
		};
		let shares = {};
		// The year total over the months as chosen; 'own' keeps the months as they are.
		const spread = () => {
			const total = Number(String(part('total').value).replace(',', '.'));
			const chosen = shares[part('spread').value];
			if (!(total > 0) || !chosen) return;
			inputs.forEach((input, m) => {
				input.value = round(total * chosen[m]);
			});
			showSum();
		};

		async function load() {
			try {
				const data = await Homey.emit('custom_get');
				unit = data.unit || '';
				part('title').textContent = data.title || '';
				part('totalLabel').textContent = `${Homey.__('budget.custom_total')} (${unit})`;
				part('total').value = data.total || '';
				shares = data.shares || {};
				const select = part('spread');
				['even', 'local', 'own'].filter((id) => id === 'own' || shares[id]).forEach((id) => {
					// 'even' is the distribution "Evenly" (id linear): the same term.
					select.appendChild(el('option', { value: id, textContent: Homey.__(id === 'even' ? 'budget.linear' : `budget.custom_spread_${id}`) }));
				});
				inputs = (data.months || []).map((name, m) => {
					// Compact rows: two months each, the name next to its field.
					const label = el('label', {
						className: 'homey-form-label', htmlFor: `customMonth${m}`, textContent: name, style: 'margin: 0;',
					});
					const input = el('input', {
						className: 'homey-form-input', type: 'number', step: 'any', min: '0', id: `customMonth${m}`, style: 'box-sizing: border-box; width: 100%; min-width: 0; margin: 0;',
					});
					input.addEventListener('input', () => {
						select.value = 'own';
						showSum();
					});
					part('months').appendChild(label);
					part('months').appendChild(input);
					return input;
				});
				select.addEventListener('change', spread);
				part('total').addEventListener('input', spread);
				// Present months, else the year total spread evenly.
				if (Array.isArray(data.values)) {
					select.value = 'own';
					inputs.forEach((input, m) => {
						input.value = data.values[m];
					});
				} else {
					select.value = 'even';
					spread();
				}
				showSum();
			} catch (error) {
				Homey.alert(error.message || error, 'error');
			} finally {
				Homey.hideLoadingOverlay();
			}
		}

		part('next').addEventListener('click', async () => {
			const button = part('next');
			if (button.classList.contains('is-loading')) return;
			button.classList.add('is-loading');
			try {
				const result = await Homey.emit('custom_set', { values: inputs.map((input) => input.value) });
				if (result && result.device) {
					await Homey.createDevice(result.device);
					Homey.done();
					return;
				}
				Homey.showView('loading');
			} catch (error) {
				button.classList.remove('is-loading');
				Homey.alert(error.message || error, 'error');
			}
		});

		load();
	})();
</script>
